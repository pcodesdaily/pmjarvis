# PMJARVIS — Discord music bot + its own Lavalink audio server.
# Deploy on a VPS with:  docker compose up -d --build
#
# Only the bot talks to Lavalink, over the private `pmjarvis` network, so no
# audio port is ever exposed to the internet.
#
# Disk footprint once running is roughly:
#   lavalink image  ~380 MB   (a JVM; this is the floor for Lavalink)
#   bot image       ~150 MB   (mostly the Node runtime itself)
#   container logs  ≤ 20 MB   (capped below)

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: pmjarvis-lavalink
    restart: unless-stopped
    # A hard ceiling so a runaway JVM cannot take the whole VPS with it.
    mem_limit: ${LAVALINK_MEM_LIMIT:-900m}
    environment:
      # SerialGC is a real saving at this heap size and a music server does no
      # allocation-heavy work, so it stays. Metaspace and thread-stack limits do
      # NOT belong here: Spring Boot plus Lavaplayer plus the YouTube plugin need
      # well over 128 MB of metaspace, and capping it made the JVM die during
      # startup. Let the JVM size those itself.
      _JAVA_OPTIONS: -Xmx${LAVALINK_XMX:-450m} -XX:+UseSerialGC
      SERVER_PORT: 2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # No volume on /opt/Lavalink/plugins on purpose. Lavalink runs as a
      # non-root user, and Docker creates a named volume owned by root, so the
      # server could not write the plugin jar it downloads and died at startup.
      # The jar is ~1.5 MB and is re-fetched only when the container is
      # recreated, which is a far better trade than a permissions landmine.
    networks:
      - pmjarvis
    healthcheck:
      # /v4/info is the documented endpoint and it requires the Authorization
      # header, which the container already has in its environment. An
      # unauthenticated probe gets a 401 and wget then exits non-zero, which is
      # what made this report unhealthy forever.
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null --header="Authorization: $$LAVALINK_PASSWORD" http://127.0.0.1:2333/v4/info || exit 1'
      interval: 15s
      timeout: 5s
      # Generous: the first boot downloads the plugin jar.
      start_period: 120s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: pmjarvis-bot:latest
    container_name: pmjarvis-bot
    restart: unless-stopped
    mem_limit: ${BOT_MEM_LIMIT:-256m}
    depends_on:
      # service_started, not service_healthy. lavalink-client already retries
      # the node connection (20 attempts, 10s apart), so the bot recovers on its
      # own once Lavalink finishes booting. Gating on health meant one wrong
      # probe stopped the whole stack from coming up.
      lavalink:
        condition: service_started
    env_file:
      - .env
    environment:
      # Inside the compose network Lavalink is reachable by service name.
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_SECURE: "false"
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      TZ: ${TZ:-UTC}
    networks:
      - pmjarvis
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  pmjarvis:
    driver: bridge
