# Lavalink v4 audio server configuration.
# Values written as ${NAME:default} are filled in from the container environment,
# so secrets live in .env and never in this file.

server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  # No plugins. SoundCloud, Bandcamp, Twitch, Vimeo, Niconico and direct audio
  # links are all built into Lavalink itself, so there is nothing to download,
  # nothing to sign in to and nothing that expires.
  plugins: []

  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"

    sources:
      # YouTube is off. It blocks datacentre IPs and needs a sign-in plus a
      # token that expires every few weeks, which is not a reasonable thing to
      # ask of anyone running a music bot.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    # ---- Audio quality -------------------------------------------------
    # 10 = best Opus encoder quality. Costs a little CPU, worth it.
    opusEncodingQuality: 10
    # HIGH resampling avoids the muddiness you get from LOW on 48kHz sources.
    resamplingQuality: HIGH
    # Bigger buffers ride out GC pauses and network hiccups without stuttering.
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    # Leave false unless you are very memory constrained; true trades a little
    # compatibility for fewer allocations.
    nonAllocatingFrameBuffer: false
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    # --------------------------------------------------------------------

    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 20
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  # No `file:` section on purpose. Docker captures stdout already, so writing
  # rotating log files as well just consumed disk. Read them with
  # `docker compose logs lavalink`.
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false
